<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F3860"/>
      <stop offset="100%" stop-color="#11223F"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2C17C"/>
      <stop offset="100%" stop-color="#C5A059"/>
    </linearGradient>
  </defs>

  <!-- Background Circle with Gold Border -->
  <circle cx="32" cy="32" r="30" fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>

  <!-- Academic Graduation Cap / Document Seal Symbol -->
  <!-- Cap Top Diamond -->
  <polygon points="32,16 48,23 32,30 16,23" fill="url(#goldGrad)"/>
  
  <!-- Cap Skull Base -->
  <path d="M22,26 L22,33 C22,38 42,38 42,33 L42,26 Z" fill="#FFFFFF" opacity="0.95"/>
  
  <!-- Tassel -->
  <path d="M44,24.5 L47,33 L45,34 L43.5,33 Z" fill="url(#goldGrad)"/>
  
  <!-- Document Sheet / Envelope Symbol Below -->
  <rect x="22" y="38" width="20" height="13" rx="2" fill="#FFFFFF" opacity="0.95"/>
  <!-- Envelope Lines / Checkmark -->
  <path d="M22,38 L32,45 L42,38" fill="none" stroke="url(#navyGrad)" stroke-width="1.5" stroke-linejoin="round"/>
  <line x1="26" y1="46" x2="38" y2="46" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
</svg>
